<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЛЬФАПРОМ — Быстрый поиск оборудования</title>
<style>
:root{--orange:#ff8100;--bg:#f6f7f9;--text:#20242a;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--yellow:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:25px;color:var(--orange)}.tag{font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:28px 22px 60px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:31px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.search{max-width:860px;margin:24px auto 9px;background:#fff;border:1px solid #d7dbe0;border-radius:15px;padding:7px;display:flex;box-shadow:0 7px 28px #0000000d}
input{flex:1;border:0;outline:0;font-size:17px;padding:14px;background:transparent;min-width:0}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eef0f3;color:#222}.examples{font-size:13px;color:var(--muted)}.examples span{text-decoration:underline;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;margin:13px 0;box-shadow:0 3px 15px #00000008}.title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#e8f7ed;color:#147a35}.why,.small{font-size:12px;color:var(--muted);margin-top:7px}
.questions{display:flex;flex-wrap:wrap;gap:8px}.q{background:#f7f8fa;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.suppliers{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px}.supplier{border:1px solid var(--line);border-radius:13px;padding:15px}.prio{font-weight:900}.A{color:var(--green)}.B{color:var(--yellow)}.C{color:#6b7280}.supplier h3{margin:6px 0}.external{border:2px dashed #f1bd7d;background:#fffaf4}.preview{background:#fff;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:13px;line-height:1.5;margin-top:10px}footer{text-align:center;color:#9298a1;font-size:12px;padding:25px}
@media(max-width:650px){.search{display:block}.search button{width:100%;margin-top:4px}.tag{display:none}.hero h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">АЛЬФАПРОМ</div><div class="tag">Быстрый поиск оборудования и поставщика</div></div></header>
<main>
<section class="hero">
<h1>🔎 Что нужно найти?</h1><p>Введите запрос менеджера или формулировку клиента</p>
<div class="search"><input id="search" placeholder="например: небольшой вакууматор для мяса"><button class="primary" onclick="search()">НАЙТИ</button></div>
<div class="examples">Примеры: <span onclick="demo('небольшой вакууматор для мяса')">небольшой вакууматор для мяса</span> · <span onclick="demo('запайщик лотков для мяса 500 шт в час')">запайщик лотков 500 шт/час</span> · <span onclick="demo('автоклав для тушенки')">автоклав для тушенки</span></div>
</section>
<div id="results"></div>
</main>
<footer>АЛЬФАПРОМ · база поставщиков подключена к Google Sheets через Apps Script</footer>
<script src="app.js"></script>
</body></html>
