<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЛЬФАПРОМ — Быстрый поиск оборудования</title>
<style>
:root{--orange:#ff8100;--bg:#f6f7f9;--text:#20242a;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--yellow:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:25px;color:var(--orange)}.tag{font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:28px 22px 60px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:31px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.search{max-width:860px;margin:24px auto 9px;background:#fff;border:1px solid #d7dbe0;border-radius:15px;padding:7px;display:flex;box-shadow:0 7px 28px #0000000d}
input{flex:1;border:0;outline:0;font-size:17px;padding:14px;background:transparent;min-width:0}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eef0f3;color:#222}.examples{font-size:13px;color:var(--muted)}.examples span{text-decoration:underline;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;margin:13px 0;box-shadow:0 3px 15px #00000008}.title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#e8f7ed;color:#147a35}.why,.small{font-size:12px;color:var(--muted);margin-top:7px}
.questions{display:flex;flex-wrap:wrap;gap:8px}.q{background:#f7f8fa;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.suppliers{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px}.supplier{border:1px solid var(--line);border-radius:13px;padding:15px}.prio{font-weight:900}.A{color:var(--green)}.B{color:var(--yellow)}.C{color:#6b7280}.supplier h3{margin:6px 0}.external{border:2px dashed #f1bd7d;background:#fffaf4}.preview{background:#fff;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:13px;line-height:1.5;margin-top:10px}footer{text-align:center;color:#9298a1;font-size:12px;padding:25px}
@media(max-width:650px){.search{display:block}.search button{width:100%;margin-top:4px}.tag{display:none}.hero h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">АЛЬФАПРОМ</div><div class="tag">Быстрый поиск оборудования и поставщика</div></div></header>
<main>
<section class="hero">
<h1>🔎 Что нужно найти?</h1><p>Введите запрос менеджера или формулировку клиента</p>
<div class="search"><input id="search" placeholder="например: небольшой вакууматор для мяса"><button class="primary" onclick="search()">НАЙТИ</button></div>
<div class="examples">Примеры: <span onclick="demo('небольшой вакууматор для мяса')">небольшой вакууматор для мяса</span> · <span onclick="demo('запайщик лотков для мяса 500 шт в час')">запайщик лотков 500 шт/час</span> · <span onclick="demo('автоклав для тушенки')">автоклав для тушенки</span></div>
</section>
<div id="results"></div>
</main>
<footer>АЛЬФАПРОМ · база поставщиков подключена к Google Sheets через Apps Script</footer>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyfAoAmHOiM2O18kEh-AAjzNKv5reH1RErFZp0-wNKKKJbSG3kxW9el8bqTMo8ZzI8/exec";
let C=[];
let ROWS=[];
let API_LOADED=false;
let API_ERROR="";

function esc(x){
  return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function val(x){return x==null?"":String(x).trim()}
function toList(x){
  if(Array.isArray(x)) return x.map(val).filter(Boolean);
  const s=val(x);
  if(!s) return [];
  return s.split(/\\n|[;\\r]+/).map(x=>x.trim()).filter(Boolean);
}
function priorityRank(x){return ({A:1,B:2,C:3})[String(x||"").trim().toUpperCase()]||9}

function normalizeSupplier(s){
  s=s||{};
  return {
    name:val(s.name)||"Без названия",
    brand:val(s.brand),
    country:val(s.country),
    legalName:val(s.legalName),
    site:val(s.site),
    status:val(s.status),
    discount:val(s.discount),
    groups:val(s.groups),
    workFeatures:val(s.workFeatures),
    additionalInfo:val(s.additionalInfo),
    contact:val(s.mainContact),
    advantages:val(s.advantages),
    note:val(s.comments),
    department:val(s.department),
    phone:val(s.phone),
    email:val(s.email),
    messenger:val(s.messenger),
    additionalContacts:val(s.additionalContacts),
    serviceCenter:val(s.serviceCenter),
    showroom:val(s.showroom),
    warehouse:val(s.warehouse),
    pickup:val(s.pickup),
    deliveryToTK:val(s.deliveryToTK),
    deliveryTerms:val(s.deliveryTerms),
    shipmentRequest:val(s.shipmentRequest),
    accounting:val(s.accounting),
    categoryId:val(s.categoryId),
    priority:val(s.priority).toUpperCase()
  };
}

/*
  КРИТИЧЕСКОЕ ПРАВИЛО:
  Один элемент API = одна исходная строка Google Sheets.
  Мы НЕ переносим данные поставщика в глобальный S и НЕ объединяем строки
  по имени поставщика. Категория, вопросы, особенности и поставщик всегда
  остаются связаны с одной и той же строкой.
*/
function buildData(items){
  ROWS=(Array.isArray(items)?items:[]).map((row,index)=>{
    const category=val(row.category);
    const cm=row.categoryData||row.categoryInfo||row;

    // Пустая категория = строка некорректна. Не пытаемся угадать категорию.
    if(!category) return null;

    const supplier=normalizeSupplier(row.supplier||{});

    return {
      rowIndex:index,
      category,
      categoryNorm:n(category),
      keywords:toList(cm.keywords),
      questions:toList(cm.questions),
      features:val(cm.features),
      supplier
    };
  }).filter(Boolean);

  const catMap=new Map();

  ROWS.forEach(row=>{
    if(!catMap.has(row.category)){
      catMap.set(row.category,{
        id:"cat-"+n(row.category).replace(/[^a-z0-9а-я]+/gi,"-"),
        name:row.category,
        kw:[],
        q:[],
        note:"",
        rows:[]
      });
    }

    const c=catMap.get(row.category);
    c.rows.push(row);

    // Объединяем только одинаковую категорию.
    // Данные другой категории сюда попасть не могут.
    c.kw=[...new Set([...c.kw,...row.keywords])];
    c.q=[...new Set([...c.q,...row.questions])];
    if(!c.note && row.features) c.note=row.features;
  });

  C=[...catMap.values()].map(c=>{
    c.s=c.rows.map(r=>r.supplier);
    c.s.sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority));
    return c;
  });
}

async function loadApi(){

  const results=document.getElementById("results");
  results.innerHTML='<div class="card"><div class="title">Подключение</div>Загружаю актуальную базу поставщиков АЛЬФАПРОМ…</div>';
  try{
    const r=await fetch(API_URL,{method:"GET",cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(!data||data.success!==true||!Array.isArray(data.items)) throw new Error("API вернул неожиданный формат");
    buildData(data.items);
    if(!C.length) throw new Error("API не вернул категорий");
    API_LOADED=true;
    results.innerHTML='<div class="card"><div class="title">Готово</div>База поставщиков загружена: '+data.items.length+' записей.</div>';
  }catch(e){
    API_ERROR=e.message||"Ошибка подключения";
    results.innerHTML='<div class="card"><div class="title">Не удалось загрузить базу</div><div>'+esc(API_ERROR)+'</div><div class="small">Проверьте доступность Apps Script API.</div></div>';
  }
}

function n(x){return x.toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}\s-]/gu," ").replace(/\s+/g," ").trim()}
function score(query,c){
  const q=n(query);
  let best=0,hits=[];

  // Ищем только по данным ЭТОЙ категории.
  const all=[c.name,...c.kw];

  all.forEach(k=>{
    const x=n(k);
    if(!x) return;
    if(q===x || q.includes(x)){
      const v=x===n(c.name)?100:(x.split(" ").length>1?80:45);
      if(v>best) best=v;
      hits.push(k);
    }
  });

  const ws=q.split(" ").filter(x=>x.length>2);
  let over=0;
  ws.forEach(w=>{
    if(all.some(k=>n(k).split(" ").includes(w))) over++;
  });
  best+=Math.min(over*10,30);

  // Дополнительные правила — только по названию самой категории.
  const cn=n(c.name);
  if((q.includes("тушен")||q.includes("консерв"))&&cn.includes("автоклав"))best+=30;
  if(q.includes("котлет")&&cn.includes("котлет"))best+=30;
  if((q.includes("небольш")||q.includes("маленьк")||q.includes("компакт"))&&cn.includes("вакуум")&&cn.includes("небольш"))best+=25;
  if((q.includes("небольш")||q.includes("ручн")||q.includes("настольн"))&&cn.includes("запай")&&cn.includes("небольш"))best+=25;
  if(q.includes("конвейер")&&cn.includes("запай")&&cn.includes("промыш"))best+=25;
  if(q.includes("полуавтомат")&&cn.includes("полуавтомат"))best+=30;

  return {score:Math.min(best,99),hits:[...new Set(hits)].slice(0,4)};
}
function demo(x){document.getElementById("search").value=x;search()}
function search(){
  let q=document.getElementById("search").value.trim();
  if(!q){document.getElementById("results").innerHTML="";return}
  if(!API_LOADED){
    document.getElementById("results").innerHTML='<div class="card"><div class="title">База ещё не готова</div>'+esc(API_ERROR||"Подождите окончания загрузки данных.")+'</div>';
    return;
  }
  let r=C.map(c=>({...c,m:score(q,c)})).filter(c=>c.m.score>=25).sort((a,b)=>b.m.score-a.m.score);
  if(!r.length){document.getElementById("results").innerHTML=external(q,null);return}
  let top=r[0],h='<div class="card"><div class="title">Найдено</div><h2>'+esc(top.name)+'</h2><span class="pill">Совпадение '+top.m.score+'%</span><div class="why">Совпало: '+esc(top.m.hits.join(", ")||"контекст запроса")+'</div></div>';
  if(r.length>1&&r[1].m.score>=55){
    h+='<div class="card"><div class="title">Возможные категории</div>'+r.slice(0,3).map(c=>'<button class="secondary" style="margin:4px" onclick="pick(\''+esc(c.id)+'\')">'+esc(c.name)+' · '+c.m.score+'%</button>').join("")+'</div>';
  }
  h+=render(top,q);
  document.getElementById("results").innerHTML=h;
}
function pick(id){
  const c=C.find(x=>x.id===id);
  const q=document.getElementById("search").value;
  if(c) document.getElementById("results").innerHTML=render(c,q);
}
function render(c,q){
  const hQuestions=c.q.map(x=>'<div class="q">☐ '+esc(x)+'</div>').join("");
  let h='<div class="card"><div class="title">Что уточнить у клиента</div><div class="questions">'+hQuestions+'</div><div class="actions"><button class="secondary" onclick=\'copyQ('+JSON.stringify(c.q)+')\'>Скопировать вопросы</button></div></div>';

  h+='<div class="card"><div class="title">Особенности категории</div>'+esc(c.note||"Уточнить задачу клиента и подобрать оборудование по параметрам.")+'</div>';

  // Поставщики берутся ТОЛЬКО из строк этой категории.
  h+='<div class="card"><div class="title">Поставщики</div><div class="suppliers">'+c.rows.map(r=>supplier(r.supplier)).join("")+'</div></div>';

  return h+external(q,c.name);
}
function supplier(s){
  const details=[];
  if(s.country) details.push("🌍 "+esc(s.country));
  if(s.legalName) details.push("Юрлицо: "+esc(s.legalName));
  if(s.status) details.push("Статус: "+esc(s.status));
  if(s.groups) details.push("Группы: "+esc(s.groups));
  const actions=[];
  if(s.site) actions.push('<button class="secondary" onclick="open(\''+esc(s.site)+'\')">Сайт</button>');
  if(s.phone) actions.push('<button class="secondary" onclick="location.href=\'tel:'+s.phone.replace(/[^0-9+]/g,"")+'\'">Позвонить</button>');
  if(s.email) actions.push('<button class="secondary" onclick="location.href=\'mailto:'+esc(s.email)+'\'">Email</button>');
  if(s.messenger) details.push("Мессенджер: "+esc(s.messenger));
  if(s.workFeatures) details.push("Особенности работы: "+esc(s.workFeatures));
  if(s.advantages) details.push("Преимущества: "+esc(s.advantages));
  if(s.note) details.push("Комментарий: "+esc(s.note));
  return '<div class="supplier"><div class="prio '+esc(s.priority)+'">'+esc(s.priority||"—")+' · '+esc(s.name)+'</div><div class="small">'+esc(s.brand||"")+'</div><h3>'+esc(s.contact||"Контакт не заполнен")+'</h3><div class="small">'+(s.phone?"📞 "+esc(s.phone):"")+(s.email?"<br>✉ "+esc(s.email):"")+'</div><div class="small"><b>Скидка:</b> '+esc(s.discount||"—")+'</div>'+(details.length?'<div class="small" style="line-height:1.55">'+details.join("<br>")+'</div>':"")+'<div class="actions">'+actions.join("")+'</div></div>';
}
function external(q,cat){let p=`Найди в России производителей и крупных официальных импортеров ${cat?`оборудования категории «${cat}» `:"оборудования для пищевого производства "}по запросу клиента: «${q}». Нужны компании, реально поставляющие оборудование в РФ. Приоритет: производитель, официальный представитель или крупный импортер. Укажи название компании, бренд, официальный сайт, контакты, производителя и наличие российского представительства/импортера. Не включай маркетплейсы, мелкие магазины и случайных посредников.`;let y="https://yandex.ru/search/?text="+encodeURIComponent(p),g="https://chatgpt.com/?q="+encodeURIComponent(p);return `<div class="card external"><div class="title">Расширить поиск</div><h3>Не нашли подходящего поставщика?</h3><div class="small">Сервис подготовил профессиональный запрос на производителя или крупного импортёра в РФ.</div><div class="preview">${p}</div><div class="actions"><button class="primary" onclick="open('${y}')">🔎 Найти в Яндекс AI</button><button class="secondary" onclick="open('${g}')">🤖 Найти через ChatGPT</button></div></div>`}
function open(u){window.open(u,"_blank")}
async function copyQ(a){try{await navigator.clipboard.writeText(a.map(x=>"• "+x).join("\n"));alert("Вопросы скопированы")}catch(e){alert(a.join("\n"))}}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search()});\nloadApi();
</script>
</body></html>
