<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЛЬФАПРОМ — Быстрый поиск оборудования</title>
<style>
:root{--orange:#ff8100;--bg:#f6f7f9;--text:#20242a;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--yellow:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:25px;color:var(--orange)}.tag{font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:28px 22px 60px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:31px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.search{max-width:860px;margin:24px auto 9px;background:#fff;border:1px solid #d7dbe0;border-radius:15px;padding:7px;display:flex;box-shadow:0 7px 28px #0000000d}
input{flex:1;border:0;outline:0;font-size:17px;padding:14px;background:transparent;min-width:0}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eef0f3;color:#222}.examples{font-size:13px;color:var(--muted)}.examples span{text-decoration:underline;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;margin:13px 0;box-shadow:0 3px 15px #00000008}.title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#e8f7ed;color:#147a35}.why,.small{font-size:12px;color:var(--muted);margin-top:7px}
.questions{display:flex;flex-wrap:wrap;gap:8px}.q{background:#f7f8fa;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.suppliers{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px}.supplier{border:1px solid var(--line);border-radius:13px;padding:15px}.prio{font-weight:900}.A{color:var(--green)}.B{color:var(--yellow)}.C{color:#6b7280}.supplier h3{margin:6px 0}.external{border:2px dashed #f1bd7d;background:#fffaf4}.preview{background:#fff;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:13px;line-height:1.5;margin-top:10px}footer{text-align:center;color:#9298a1;font-size:12px;padding:25px}
@media(max-width:650px){.search{display:block}.search button{width:100%;margin-top:4px}.tag{display:none}.hero h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">АЛЬФАПРОМ</div><div class="tag">Быстрый поиск оборудования и поставщика</div></div></header>
<main>
<section class="hero">
<h1>🔎 Что нужно найти?</h1><p>Введите запрос менеджера или формулировку клиента</p>
<div class="search"><input id="search" placeholder="например: небольшой вакууматор для мяса"><button class="primary" onclick="search()">НАЙТИ</button></div>
<div class="examples">Примеры: <span onclick="demo('небольшой вакууматор для мяса')">небольшой вакууматор для мяса</span> · <span onclick="demo('запайщик лотков для мяса 500 шт в час')">запайщик лотков 500 шт/час</span> · <span onclick="demo('автоклав для тушенки')">автоклав для тушенки</span></div>
</section>
<div id="results"></div>
</main>
<footer>АЛЬФАПРОМ · прототип MVP v1 · данные пока тестовые</footer>
<script>
const S={
"Протэк":{brand:"ТМ Протэк",site:"https://protekgroup.com",contact:"Юрий",phone:"8 916 510 5730",email:"Y.Lipnitsky@protekgroup.com",discount:"25%",note:"Не показывать клиенту марку Протэк в начале работы."},
"Хуалянь":{brand:"ТМ Hualian",site:"https://hmru.ru",contact:"Павел Киселев",phone:"8 968 009-23-99",email:"pk@hmru.ru",discount:"25%",note:"Строгий запрет на демпинг. Запросы и отгрузки — через МАКС."},
"Георг Полимер":{brand:"ТМ Resure",site:"https://georgpolymer.ru",contact:"Сергей / Екатерина Корнейчик",phone:"+7 906 311-17-70 / +7 903 149-08-41",email:"ken@georgpolymer.ru",discount:"19–20%",note:"Заявки на отгрузку и доверенности направляются бухгалтеру."},
"Русский проект":{brand:"ТМ Indokor",site:"https://rp.ru",contact:"Артёмова Тамара",phone:"8-910-816-87-10",email:"artemova@rp.ru",discount:"15%",note:"Оборудование, ЗИП и расходка."},
"ПКБ-Тис / Тугулев":{brand:"Heffler Vac",site:"",contact:"—",phone:"—",email:"—",discount:"10%",note:"Статус: переговоры."},
"Агрозавод":{brand:"Фудатлас",site:"",contact:"—",phone:"—",email:"—",discount:"—",note:"Поставщик из базы АЛЬФАПРОМ."},
"Пищевые Технологии":{brand:"",site:"",contact:"—",phone:"—",email:"—",discount:"—",note:"Поставщик из базы АЛЬФАПРОМ."}
};
const C=[
{id:"tray-ind",name:"Запайщики лотков промышленные",kw:["запайщик лотков","трейсилер","tray sealer","промышленный запайщик лотков","автоматический запайщик лотков","конвейерный запайщик","запайщик лотков с конвейером","промышленный трейсилер","автоматический трейсилер","tray sealing machine","запайщик лотков map"],q:["Какой продукт?","В каком виде продукт?","Какой тип упаковки?","Какой срок хранения?","Какая производительность?","Размер и форма лотков","Тип упаковочного материала","Нужна ли настройка под разные размеры?"],note:"Производительность и цена сильно различаются. Уточнить бюджет; предлагать под ключ, пусконаладку, обучение, лотки и пленку.",s:[["A","Протэк"],["A","Хуалянь"],["B","Георг Полимер"],["C","ПКБ-Тис / Тугулев"]]},
{id:"tray-semi",name:"Запайщики лотков полуавтомат (средн. произв-сть)",kw:["полуавтоматический запайщик лотков","полуавтомат запайки лотков","полуавтомат для запайки лотков","полуавтоматический трейсилер","полуавтоматический tray sealer","запайщик лотков средней производительности","запайщик для мяса","запайщик для рыбы","запайщик для полуфабрикатов"],q:["Какой продукт?","В каком виде продукт?","Какой тип упаковки?","Какая производительность?","Размер и форма лотков","Тип материала","Нужна ли MAP?"],note:"Для средней производительности. Ключевые параметры — производительность, размер лотка и необходимость MAP.",s:[["A","Хуалянь"],["A","Георг Полимер"],["B","Русский проект"],["C","ПКБ-Тис / Тугулев"]]},
{id:"tray-small",name:"Запайщики лотков небольшие (ручные и т.д.)",kw:["ручной запайщик лотков","ручная запайка лотков","настольный запайщик лотков","настольный трейсилер","ручной трейсилер","компактный запайщик лотков","небольшой запайщик лотков","малогабаритный запайщик лотков","запайщик лотков малой производительности","запайщик лотков для небольшого производства","запайщик лотков для кафе","запайщик лотков для ресторана","запайщик лотков map"],q:["Какой продукт?","Какая производительность?","Размер и форма лотков","Тип материала лотка","Размер пленки","Нужна ли MAP?"],note:"Ручные и настольные решения для небольших объёмов.",s:[["A","Хуалянь"],["A","Георг Полимер"],["B","Русский проект"],["C","ПКБ-Тис / Тугулев"]]},
{id:"vac-ind",name:"Вакуумные упаковщики промышленные",kw:["промышленный вакууматор","промышленный вакуумный упаковщик","вакуумная упаковочная машина","камерный вакуумный упаковщик","промышленный камерный вакууматор","вакуумный упаковщик для производства","промышленный вакууматор для мяса","промышленный вакууматор для рыбы"],q:["Какой продукт?","Производительность?","Размер пакета?","Какой тип пакета?","Размер камеры?","Требуется ли газовая среда?"],note:"Критичны размер камеры, длина планки, производительность и продукт.",s:[["A","Хуалянь"],["A","Георг Полимер"],["B","Русский проект"]]},
{id:"vac-small",name:"Вакуумные упаковщики небольшие",kw:["вакуумный упаковщик","вакууматор","небольшой вакууматор","компактный вакууматор","настольный вакууматор","настольный вакуумный упаковщик","профессиональный настольный вакууматор","компактный вакуумный упаковщик","малогабаритный вакуумный упаковщик","вакуумный упаковщик для небольшого производства","вакууматор для кафе","вакууматор для ресторана","вакууматор для магазина","камерный вакууматор","настольный камерный вакууматор","небольшой камерный вакууматор","вакууматор для мяса","вакууматор для рыбы","вакууматор для сыра","вакууматор для полуфабрикатов"],q:["Какой продукт?","Какая производительность?","Размер пакета?","Какой тип упаковки?","Нужна ли газовая среда?"],note:"Компактные камерные вакууматоры для небольших производств, кафе, магазинов и небольших объёмов.",s:[["A","Хуалянь"],["A","Георг Полимер"],["B","Русский проект"]]},
{id:"cutlet",name:"Котлетные аппараты",kw:["котлетный аппарат","котлетный автомат","аппарат для формовки котлет","формовщик котлет","формирователь котлет","котлетоформовочная машина","котлетоформовщик","автомат для производства котлет","промышленный формовщик котлет","оборудование для производства котлет","формовщик полуфабрикатов","аппарат для формовки полуфабрикатов","машина для формовки полуфабрикатов","аппарат для котлет","машина для котлет"],q:["Какой продукт?","Требуемая производительность?","Масса одной котлеты?","Форма и размер изделия?","Размер формующей оснастки?"],note:"Важно уточнить массу и геометрию изделия и требуемую производительность.",s:[["A","Агрозавод"],["B","Русский проект"]]},
{id:"autoclave",name:"Автоклавы",kw:["автоклав","промышленный автоклав","пищевой автоклав","автоклав для консервирования","автоклав для консервов","автоклав для производства консервов","автоклав для стерилизации","промышленный стерилизатор","пищевой стерилизатор","стерилизатор для консервов","оборудование для стерилизации","автоклавная установка","паровой автоклав","водяной автоклав","пароводяной автоклав","горизонтальный автоклав","вертикальный автоклав","автоклав для мяса","автоклав для тушенки","автоклав для тушёнки","автоклав для банок","реторт"],q:["Что стерилизуется?","Тип и размер тары?","Производительность/загрузка?","Требуемый режим стерилизации?","Пар или вода?","Горизонтальный или вертикальный?"],note:"Критичны тара, загрузка, режим стерилизации и теплоноситель.",s:[["A","Пищевые Технологии"],["B","Агрозавод"]]}
];
function n(x){return x.toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}\s-]/gu," ").replace(/\s+/g," ").trim()}
function score(query,c){let q=n(query), best=0,hits=[];let all=[c.name,...c.kw];all.forEach(k=>{let x=n(k);if(q.includes(x)){let v=x===n(c.name)?100:x.split(" ").length>1?80:45;if(v>best)best=v;hits.push(k)}});let ws=q.split(" ").filter(x=>x.length>2),over=0;ws.forEach(w=>{if(all.some(k=>n(k).split(" ").includes(w)))over++});best+=Math.min(over*10,30);
if((q.includes("небольш")||q.includes("маленьк")||q.includes("компакт"))&&c.id==="vac-small")best+=25;
if((q.includes("небольш")||q.includes("ручн")||q.includes("настольн"))&&c.id==="tray-small")best+=25;
if(q.includes("конвейер")&&c.id==="tray-ind")best+=25;if(q.includes("полуавтомат")&&c.id==="tray-semi")best+=30;
if((q.includes("тушен")||q.includes("консерв"))&&c.id==="autoclave")best+=30;if(q.includes("котлет")&&c.id==="cutlet")best+=30;
return {score:Math.min(best,99),hits:[...new Set(hits)].slice(0,4)}}
function demo(x){document.getElementById("search").value=x;search()}
function search(){let q=document.getElementById("search").value.trim();if(!q){document.getElementById("results").innerHTML="";return}let r=C.map(c=>({...c,m:score(q,c)})).filter(c=>c.m.score>=25).sort((a,b)=>b.m.score-a.m.score);if(!r.length){document.getElementById("results").innerHTML=external(q,null);return}let top=r[0],h=`<div class="card"><div class="title">Найдено</div><h2>${top.name}</h2><span class="pill">Совпадение ${top.m.score}%</span><div class="why">Совпало: ${top.m.hits.join(", ")||"контекст запроса"}</div></div>`;
if(r.length>1&&r[1].m.score>=55){h+=`<div class="card"><div class="title">Возможные категории</div>${r.slice(0,3).map(c=>`<button class="secondary" style="margin:4px" onclick="pick('${c.id}')">${c.name} · ${c.m.score}%</button>`).join("")}</div>`}
h+=render(top,q);document.getElementById("results").innerHTML=h}
function pick(id){let c=C.find(x=>x.id===id),q=document.getElementById("search").value;document.getElementById("results").innerHTML=render(c,q)}
function render(c,q){let h=`<div class="card"><div class="title">Что уточнить у клиента</div><div class="questions">${c.q.map(x=>`<div class="q">☐ ${x}</div>`).join("")}</div><div class="actions"><button class="secondary" onclick='copyQ(${JSON.stringify(c.q)})'>Скопировать вопросы</button></div></div><div class="card"><div class="title">Особенности категории</div>${c.note}</div><div class="card"><div class="title">Поставщики</div><div class="suppliers">${c.s.map(x=>supplier(x[0],x[1])).join("")}</div></div>`;return h+external(q,c.name)}
function supplier(p,name){let s=S[name]||{};return `<div class="supplier"><div class="prio ${p}">${p} · ${name}</div><div class="small">${s.brand||""}</div><h3>${s.contact||"Контакт не заполнен"}</h3><div class="small">${s.phone&&s.phone!=="—"?"📞 "+s.phone:""}${s.email&&s.email!=="—"?"<br>✉ "+s.email:""}</div><div class="small"><b>Скидка:</b> ${s.discount||"—"}</div><div class="small">${s.note||""}</div><div class="actions">${s.site?`<button class="secondary" onclick="open('${s.site}')">Сайт</button>`:""}${s.phone&&s.phone!=="—"?`<button class="secondary" onclick="location.href='tel:${s.phone.replace(/[^0-9+]/g,"")}'">Позвонить</button>`:""}${s.email&&s.email!=="—"?`<button class="secondary" onclick="location.href='mailto:${s.email}'">Email</button>`:""}</div></div>`}
function external(q,cat){let p=`Найди в России производителей и крупных официальных импортеров ${cat?`оборудования категории «${cat}» `:"оборудования для пищевого производства "}по запросу клиента: «${q}». Нужны компании, реально поставляющие оборудование в РФ. Приоритет: производитель, официальный представитель или крупный импортер. Укажи название компании, бренд, официальный сайт, контакты, производителя и наличие российского представительства/импортера. Не включай маркетплейсы, мелкие магазины и случайных посредников.`;let y="https://yandex.ru/search/?text="+encodeURIComponent(p),g="https://chatgpt.com/?q="+encodeURIComponent(p);return `<div class="card external"><div class="title">Расширить поиск</div><h3>Не нашли подходящего поставщика?</h3><div class="small">Сервис подготовил профессиональный запрос на производителя или крупного импортёра в РФ.</div><div class="preview">${p}</div><div class="actions"><button class="primary" onclick="open('${y}')">🔎 Найти в Яндекс AI</button><button class="secondary" onclick="open('${g}')">🤖 Найти через ChatGPT</button></div></div>`}
function open(u){window.open(u,"_blank")}
async function copyQ(a){try{await navigator.clipboard.writeText(a.map(x=>"• "+x).join("\n"));alert("Вопросы скопированы")}catch(e){alert(a.join("\n"))}}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
</script>
</body></html>
